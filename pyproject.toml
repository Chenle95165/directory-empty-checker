[project]
name = "directory-empty-checker"
version = "0.1.0"
description = "Returns whether a directory contains no files, treating subdirectories with content recursively."
requires-python = ">=3.10"
dependencies = []
readme = "README.md"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
